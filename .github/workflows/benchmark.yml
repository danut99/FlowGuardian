name: Controlled browser benchmark

on:
  push:
    paths:
      - 'backend/worker/**'
      - 'backend/supabase/migrations/**'
      - '.github/workflows/benchmark.yml'
  pull_request:
    paths:
      - 'backend/worker/**'
      - 'backend/supabase/migrations/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/worker/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test scripts/outcomes.test.mjs scripts/trust-checks.test.mjs scripts/test-credentials.test.mjs scripts/credential-storage.test.mjs
      - run: npm run benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-browser-benchmark
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 14
